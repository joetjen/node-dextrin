name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18.18.0", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Precommit
        run: npm run precommit

      - name: Verify package assembles (npm pack)
        run: npm pack --dry-run

  typespec-emitter:
    # packages/dextrin-typespec, the TypeSpec emitter: TypeSpec needs Node 22.
    name: TypeSpec emitter (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dextrin-typespec
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/dextrin-typespec/package-lock.json

      - name: Install the library's own dependencies
        run: npm ci
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify package assembles (npm pack)
        run: npm pack --dry-run
